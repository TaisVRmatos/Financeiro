[server]
# Configuração para Render - porta dinâmica
port = 8501
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false
runOnSave = false

[browser]
gatherUsageStats = false

[logger]
level = "error"

[theme]
base = "light"
primaryColor = "#1a3a5c"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e293b"
font = "sans serif"